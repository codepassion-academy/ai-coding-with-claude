# Deploy to Cloudflare Workers when main changes (ADR 0003). Lint and tests must pass first.
# Needs repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit + Workers R2 Storage: Edit)
# and CLOUDFLARE_ACCOUNT_ID. CLIENT_KEY_SECRET is a Worker secret, set once with `wrangler secret put`.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_tiles:
        description: Upload public/tiles/*.pmtiles to R2 even if unchanged (first deploy)
        type: boolean
        default: false

# One deploy at a time; a newer push waits instead of cancelling a deploy half-way.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  WRANGLER_VERSION: "4.145.0"

jobs:
  deploy:
    # Students fork/clone main as the class starting point; only this repo deploys.
    if: github.repository == 'codepassion-academy/ai-coding-with-claude'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Did the tiles change?
        id: tiles
        env:
          BEFORE: ${{ github.event.before }}
          FORCE: ${{ inputs.upload_tiles }}
        run: |
          # A new branch or a forced run has no usable "before" commit: upload.
          if [ "$FORCE" = "true" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
            || ! git diff --quiet "$BEFORE" HEAD -- public/tiles/; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Tiles are too big for Static Assets (25 MiB per file), so they live in R2. --remote: without it
      # wrangler writes to the runner's local storage and nothing reaches Cloudflare.
      - name: Upload tiles to R2
        if: steps.tiles.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: |
            r2 object put namthuam-tiles/bangkok.pmtiles --file public/tiles/bangkok.pmtiles --content-type application/octet-stream --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          command: deploy
