<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>น้ำท่วมไหม on Cloudflare</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #F5F5F7;
      --color-ink:    #1D1D1F;
      --color-muted:  #6E6E73;
      --color-soft:   #86868B;
      --color-rule:   rgba(29,29,31,0.12);
      --font-sans:    'Noto Sans Thai', 'Sukhumvit Set', 'Thonburi', sans-serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 1.75rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.3;
      margin-bottom: 0.25rem;
    }
    .sub { color: var(--color-muted); font-size: 0.95rem; margin-bottom: 1.5rem; }
    .scroll { overflow-x: auto; }
    svg { width: 100%; min-width: 900px; display: block; }
    footer {
      margin-top: 1.25rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--color-rule);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--color-soft);
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · ADR 0003</p>
    <h1>น้ำท่วมไหม บน Cloudflare Workers</h1>
    <p class="sub">ทุก request ผ่าน Worker ก่อน รายงานและโควตาอยู่ใน Durable Object เดียว Workers Builds deploy เองเมื่อ main เปลี่ยน</p>

    <div class="scroll">
    <svg viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cloudflare-architecture-title cloudflare-architecture-desc">
      <title id="cloudflare-architecture-title">น้ำท่วมไหม on Cloudflare Workers</title>
      <desc id="cloudflare-architecture-desc">A push to main triggers Cloudflare Workers Builds, which lints, tests and deploys the Worker; map tiles sit in R2, uploaded by hand; viewers reach only the Worker, which serves listed page files from Static Assets, tile byte ranges from R2, and sends API calls with an HMAC client key to one Durable Object that stores reports in SQLite.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6E6E73"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E8263F"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066CC"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5F5F7"/>

      <!-- ── Zones ─────────────────────────────────────────────── -->
      <rect x="24" y="60" width="416" height="128" rx="8" fill="rgba(29,29,31,0.02)" stroke="rgba(29,29,31,0.10)" stroke-width="0.8"/>
      <rect x="40" y="64" width="104" height="12" rx="2" fill="#F5F5F7"/>
      <text x="92" y="73" fill="rgba(29,29,31,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">GITHUB → BUILD</text>

      <rect x="480" y="60" width="496" height="440" rx="8" fill="rgba(29,29,31,0.02)" stroke="rgba(29,29,31,0.10)" stroke-width="0.8"/>
      <rect x="496" y="64" width="144" height="12" rx="2" fill="#F5F5F7"/>
      <text x="568" y="73" fill="rgba(29,29,31,0.45)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLOUDFLARE · FREE PLAN</text>

      <!-- ── Arrows (before nodes) ─────────────────────────────── -->
      <!-- main → Workers Builds -->
      <line x1="208" y1="128" x2="254" y2="128" stroke="#6E6E73" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="214" y="104" width="36" height="12" rx="2" fill="#F5F5F7"/>
      <text x="232" y="113" fill="#86868B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PUSH</text>

      <!-- Workers Builds → Worker (deploy after lint + test) -->
      <path d="M 336,160 V 192 Q 336,200 344,200 H 572 Q 580,200 580,208 V 242" fill="none" stroke="#6E6E73" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="392" y="176" width="48" height="12" rx="2" fill="#F5F5F7"/>
      <text x="416" y="185" fill="#86868B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEPLOY</text>

      <!-- Viewer → Worker -->
      <line x1="208" y1="284" x2="518" y2="284" stroke="#0066CC" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="252" y="260" width="96" height="12" rx="2" fill="#F5F5F7"/>
      <text x="300" y="269" fill="#0066CC" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EVERY REQUEST</text>

      <!-- Worker → R2 (range read) -->
      <path d="M 660,244 V 168 Q 660,160 668,160 H 778" fill="none" stroke="#6E6E73" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="684" y="140" width="80" height="12" rx="2" fill="#F5F5F7"/>
      <text x="724" y="149" fill="#86868B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RANGE → 206</text>

      <!-- Worker → Durable Object -->
      <line x1="700" y1="284" x2="778" y2="284" stroke="#E8263F" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="708" y="260" width="64" height="12" rx="2" fill="#F5F5F7"/>
      <text x="740" y="269" fill="#E8263F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HMAC KEY</text>

      <!-- Worker → Static Assets -->
      <path d="M 660,324 V 416 Q 660,424 668,424 H 778" fill="none" stroke="#6E6E73" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="688" y="400" width="72" height="12" rx="2" fill="#F5F5F7"/>
      <text x="724" y="409" fill="#86868B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FIXED LIST</text>

      <!-- ── Nodes ──────────────────────────────────────────────── -->
      <!-- GitHub main -->
      <rect x="48" y="96" width="160" height="64" rx="6" fill="#F5F5F7"/>
      <rect x="48" y="96" width="160" height="64" rx="6" fill="#ffffff" stroke="#1D1D1F" stroke-width="1"/>
      <rect x="56" y="102" width="28" height="12" rx="2" fill="transparent" stroke="rgba(29,29,31,0.40)" stroke-width="0.8"/>
      <text x="70" y="111" fill="rgba(29,29,31,0.75)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GIT</text>
      <text x="128" y="134" fill="#1D1D1F" font-size="12" font-weight="600" font-family="'Noto Sans Thai', sans-serif" text-anchor="middle">branch main</text>
      <text x="128" y="150" fill="#6E6E73" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">codepassion-academy</text>

      <!-- Workers Builds -->
      <rect x="256" y="96" width="160" height="64" rx="6" fill="#F5F5F7"/>
      <rect x="256" y="96" width="160" height="64" rx="6" fill="#ffffff" stroke="#1D1D1F" stroke-width="1"/>
      <rect x="264" y="102" width="20" height="12" rx="2" fill="transparent" stroke="rgba(29,29,31,0.40)" stroke-width="0.8"/>
      <text x="274" y="111" fill="rgba(29,29,31,0.75)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CI</text>
      <text x="336" y="134" fill="#1D1D1F" font-size="12" font-weight="600" font-family="'Noto Sans Thai', sans-serif" text-anchor="middle">Workers Builds</text>
      <text x="336" y="150" fill="#6E6E73" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lint → test → deploy</text>

      <!-- Viewer -->
      <rect x="48" y="252" width="160" height="64" rx="6" fill="#F5F5F7"/>
      <rect x="48" y="252" width="160" height="64" rx="6" fill="rgba(110,110,115,0.10)" stroke="#86868B" stroke-width="1"/>
      <rect x="56" y="258" width="32" height="12" rx="2" fill="transparent" stroke="rgba(134,134,139,0.60)" stroke-width="0.8"/>
      <text x="72" y="267" fill="#6E6E73" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="128" y="290" fill="#1D1D1F" font-size="12" font-weight="600" font-family="'Noto Sans Thai', sans-serif" text-anchor="middle">ผู้ชม / ผู้รายงาน</text>
      <text x="128" y="306" fill="#6E6E73" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">*.workers.dev</text>

      <!-- Worker (focal) -->
      <rect x="520" y="244" width="180" height="80" rx="6" fill="#F5F5F7"/>
      <rect x="520" y="244" width="180" height="80" rx="6" fill="rgba(232,38,63,0.08)" stroke="#E8263F" stroke-width="1"/>
      <rect x="528" y="250" width="32" height="12" rx="2" fill="transparent" stroke="rgba(232,38,63,0.50)" stroke-width="0.8"/>
      <text x="544" y="259" fill="#E8263F" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
      <text x="610" y="286" fill="#1D1D1F" font-size="12" font-weight="600" font-family="'Noto Sans Thai', sans-serif" text-anchor="middle">Worker</text>
      <text x="610" y="302" fill="#6E6E73" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">src/worker.ts</text>
      <text x="610" y="314" fill="#86868B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">413 · 400 · 500 · NOTICE</text>

      <!-- R2 -->
      <rect x="780" y="112" width="172" height="64" rx="6" fill="#F5F5F7"/>
      <rect x="780" y="112" width="172" height="64" rx="6" fill="rgba(29,29,31,0.05)" stroke="#6E6E73" stroke-width="1"/>
      <rect x="788" y="118" width="20" height="12" rx="2" fill="transparent" stroke="rgba(110,110,115,0.50)" stroke-width="0.8"/>
      <text x="798" y="127" fill="#6E6E73" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">R2</text>
      <text x="866" y="150" fill="#1D1D1F" font-size="12" font-weight="600" font-family="'Noto Sans Thai', sans-serif" text-anchor="middle">ไฟล์แผนที่</text>
      <text x="866" y="166" fill="#6E6E73" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bangkok.pmtiles (manual)</text>

      <!-- Durable Object (focal) -->
      <rect x="780" y="252" width="172" height="64" rx="6" fill="#F5F5F7"/>
      <rect x="780" y="252" width="172" height="64" rx="6" fill="rgba(232,38,63,0.08)" stroke="#E8263F" stroke-width="1"/>
      <rect x="788" y="258" width="20" height="12" rx="2" fill="transparent" stroke="rgba(232,38,63,0.50)" stroke-width="0.8"/>
      <text x="798" y="267" fill="#E8263F" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DO</text>
      <text x="866" y="290" fill="#1D1D1F" font-size="12" font-weight="600" font-family="'Noto Sans Thai', sans-serif" text-anchor="middle">รายงาน + โควตา</text>
      <text x="866" y="306" fill="#6E6E73" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">handle() · SQLite</text>

      <!-- Static Assets -->
      <rect x="780" y="392" width="172" height="64" rx="6" fill="#F5F5F7"/>
      <rect x="780" y="392" width="172" height="64" rx="6" fill="rgba(29,29,31,0.05)" stroke="#6E6E73" stroke-width="1"/>
      <rect x="788" y="398" width="40" height="12" rx="2" fill="transparent" stroke="rgba(110,110,115,0.50)" stroke-width="0.8"/>
      <text x="808" y="407" fill="#6E6E73" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ASSETS</text>
      <text x="866" y="430" fill="#1D1D1F" font-size="12" font-weight="600" font-family="'Noto Sans Thai', sans-serif" text-anchor="middle">หน้าเว็บแผนที่</text>
      <text x="866" y="446" fill="#6E6E73" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">public/ (no tiles)</text>

      <!-- ── Legend ─────────────────────────────────────────────── -->
      <line x1="24" y1="524" x2="976" y2="524" stroke="rgba(29,29,31,0.10)" stroke-width="0.8"/>
      <text x="24" y="552" fill="#6E6E73" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="104" y1="549" x2="136" y2="549" stroke="#0066CC" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="144" y="552" fill="#6E6E73" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PUBLIC HTTP</text>

      <line x1="264" y1="549" x2="296" y2="549" stroke="#6E6E73" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="304" y="552" fill="#6E6E73" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">INTERNAL CALL / DEPLOY</text>

      <rect x="480" y="543" width="16" height="12" rx="2" fill="rgba(232,38,63,0.08)" stroke="#E8263F" stroke-width="1"/>
      <text x="504" y="552" fill="#6E6E73" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">FOCAL: NEW IN ADR 0003</text>
    </svg>
    </div>

    <footer>ข้อมูลสมมติ · demo สำหรับสอน ไม่ใช่ระบบเตือนภัย · wrangler.jsonc · docs/adr/0003-cloudflare-hosting.md</footer>
  </div>
</body>
</html>
