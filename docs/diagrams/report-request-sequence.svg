<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="report-request-sequence-title report-request-sequence-desc">
      <title id="report-request-sequence-title">ส่งรายงานบน Cloudflare: POST /districts/:id/reports</title>
      <desc id="report-request-sequence-desc">Sequence diagram of one report submission: the browser posts to the Worker, which caps the body at 2048 bytes, parses JSON and turns CF-Connecting-IP into an HMAC key, then hands the request to the ReportsObject Durable Object, which checks quota, validates, masks and dedupes the report, saves a snapshot to SQLite only when the report is accepted, and returns 201 or 200 with the NOTICE through the Worker.</desc>
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6E6E73"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E8263F"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0066CC"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#F5F5F7"/>

      <!-- ── Lifelines (x: 128, 368, 608, 848) ─────────────────── -->
      <line x1="128" y1="128" x2="128" y2="568" stroke="#1d1d1f" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="368" y1="128" x2="368" y2="568" stroke="#1d1d1f" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="608" y1="128" x2="608" y2="568" stroke="#1d1d1f" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="848" y1="128" x2="848" y2="568" stroke="#1d1d1f" stroke-opacity="0.20" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ── Fragment: opt, save only when accepted ────────────── -->
      <rect x="560" y="412" width="312" height="68" rx="4" fill="#1d1d1f" fill-opacity="0.02" stroke="#1d1d1f" stroke-opacity="0.22" stroke-width="1"/>
      <rect x="560" y="412" width="40" height="16" rx="2" fill="#F5F5F7" stroke="#1d1d1f" stroke-opacity="0.22" stroke-width="1"/>
      <text x="580" y="424" fill="#6E6E73" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
      <text x="632" y="424" fill="#6E6E73" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[accepted: 201 / 200]</text>

      <!-- ── Activation bars ───────────────────────────────────── -->
      <rect x="364" y="180" width="8" height="364" fill="#1d1d1f" fill-opacity="0.06" stroke="#6E6E73" stroke-width="0.8"/>
      <rect x="604" y="324" width="8" height="184" fill="#e8263f" fill-opacity="0.10" stroke="#E8263F" stroke-width="0.8"/>

      <!-- ── Messages ──────────────────────────────────────────── -->
      <!-- M1 browser → Worker -->
      <line x1="128" y1="176" x2="362" y2="176" stroke="#0066CC" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- M2 Worker self: body cap + parse -->
      <path d="M 372 208 H 404 V 236 H 374" fill="none" stroke="#6E6E73" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M3 Worker self: HMAC -->
      <path d="M 372 264 H 404 V 292 H 374" fill="none" stroke="#6E6E73" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M4 Worker → DO -->
      <line x1="372" y1="328" x2="602" y2="328" stroke="#6E6E73" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M5 DO self: quota, validate, dedupe -->
      <path d="M 612 360 H 644 V 388 H 614" fill="none" stroke="#6E6E73" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M6 DO → SQLite (inside opt) -->
      <line x1="612" y1="460" x2="846" y2="460" stroke="#6E6E73" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- M7 DO → Worker return -->
      <line x1="604" y1="504" x2="374" y2="504" stroke="#6E6E73" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- M8 Worker → browser, headline -->
      <line x1="364" y1="540" x2="130" y2="540" stroke="#E8263F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- ── Message labels (masked, 6px+ above stroke) ────────── -->
      <rect x="192" y="156" width="112" height="12" rx="2" fill="#F5F5F7"/>
      <text x="248" y="165" fill="#0066CC" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST …/REPORTS</text>

      <rect x="412" y="216" width="132" height="12" rx="2" fill="#F5F5F7"/>
      <text x="416" y="225" fill="#6E6E73" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">≤2048 B · JSON.PARSE</text>

      <rect x="412" y="272" width="164" height="12" rx="2" fill="#F5F5F7"/>
      <text x="416" y="281" fill="#6E6E73" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HMAC(CF-CONNECTING-IP)</text>

      <rect x="440" y="308" width="96" height="12" rx="2" fill="#F5F5F7"/>
      <text x="488" y="317" fill="#6E6E73" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HANDLE · HASH</text>

      <rect x="652" y="368" width="172" height="12" rx="2" fill="#F5F5F7"/>
      <text x="656" y="377" fill="#6E6E73" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">QUOTA · VALIDATE · DEDUPE</text>

      <rect x="688" y="440" width="104" height="12" rx="2" fill="#F5F5F7"/>
      <text x="740" y="449" fill="#6E6E73" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UPSERT SNAPSHOT</text>

      <rect x="440" y="484" width="96" height="12" rx="2" fill="#F5F5F7"/>
      <text x="488" y="493" fill="#6E6E73" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STATUS + BODY</text>

      <rect x="196" y="520" width="104" height="12" rx="2" fill="#F5F5F7"/>
      <text x="248" y="529" fill="#E8263F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">201 · NOTICE</text>

      <!-- ── Actors (drawn last) ───────────────────────────────── -->
      <!-- ผู้รายงาน (user) -->
      <rect x="48" y="72" width="160" height="56" rx="6" fill="#F5F5F7"/>
      <rect x="48" y="72" width="160" height="56" rx="6" fill="#6e6e73" fill-opacity="0.10" stroke="#86868B" stroke-width="1"/>
      <rect x="56" y="78" width="32" height="12" rx="2" fill="none" stroke="#86868b" stroke-opacity="0.60" stroke-width="0.8"/>
      <text x="72" y="87" fill="#6E6E73" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="128" y="106" fill="#1D1D1F" font-size="12" font-weight="600" font-family="'Noto Sans Thai', sans-serif" text-anchor="middle">ผู้รายงาน</text>
      <text x="128" y="120" fill="#6E6E73" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">public/app.js</text>

      <!-- Worker -->
      <rect x="288" y="72" width="160" height="56" rx="6" fill="#F5F5F7"/>
      <rect x="288" y="72" width="160" height="56" rx="6" fill="#ffffff" stroke="#1D1D1F" stroke-width="1"/>
      <rect x="296" y="78" width="32" height="12" rx="2" fill="none" stroke="#1d1d1f" stroke-opacity="0.40" stroke-width="0.8"/>
      <text x="312" y="87" fill="#1d1d1f" fill-opacity="0.75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
      <text x="368" y="106" fill="#1D1D1F" font-size="12" font-weight="600" font-family="'Noto Sans Thai', sans-serif" text-anchor="middle">Worker</text>
      <text x="368" y="120" fill="#6E6E73" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">src/worker.ts</text>

      <!-- ReportsObject (focal) -->
      <rect x="528" y="72" width="160" height="56" rx="6" fill="#F5F5F7"/>
      <rect x="528" y="72" width="160" height="56" rx="6" fill="#e8263f" fill-opacity="0.08" stroke="#E8263F" stroke-width="1"/>
      <rect x="536" y="78" width="20" height="12" rx="2" fill="none" stroke="#e8263f" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="546" y="87" fill="#E8263F" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DO</text>
      <text x="608" y="106" fill="#1D1D1F" font-size="12" font-weight="600" font-family="'Noto Sans Thai', sans-serif" text-anchor="middle">รายงาน + โควตา</text>
      <text x="608" y="120" fill="#6E6E73" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ReportsObject · handle()</text>

      <!-- SQLite (store) -->
      <rect x="768" y="72" width="160" height="56" rx="6" fill="#F5F5F7"/>
      <rect x="768" y="72" width="160" height="56" rx="6" fill="#1d1d1f" fill-opacity="0.05" stroke="#6E6E73" stroke-width="1"/>
      <rect x="776" y="78" width="28" height="12" rx="2" fill="none" stroke="#6e6e73" stroke-opacity="0.50" stroke-width="0.8"/>
      <text x="790" y="87" fill="#6E6E73" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SQL</text>
      <text x="848" y="106" fill="#1D1D1F" font-size="12" font-weight="600" font-family="'Noto Sans Thai', sans-serif" text-anchor="middle">SQLite ของ DO</text>
      <text x="848" y="120" fill="#6E6E73" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">snapshot · 1 row</text>

      <!-- ── Legend ────────────────────────────────────────────── -->
      <line x1="24" y1="588" x2="976" y2="588" stroke="#1d1d1f" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="24" y="616" fill="#6E6E73" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="104" y1="613" x2="136" y2="613" stroke="#0066CC" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="144" y="616" fill="#6E6E73" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PUBLIC HTTP</text>

      <line x1="256" y1="613" x2="288" y2="613" stroke="#6E6E73" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="296" y="616" fill="#6E6E73" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">INTERNAL CALL</text>

      <line x1="416" y1="613" x2="448" y2="613" stroke="#6E6E73" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="456" y="616" fill="#6E6E73" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RETURN</text>

      <line x1="544" y1="613" x2="576" y2="613" stroke="#E8263F" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="584" y="616" fill="#6E6E73" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">REPLY · 201 NEW / 200 MERGED</text>
    </svg>
